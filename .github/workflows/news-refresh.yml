name: US multi-source news refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: read
concurrency:
  group: official-news-refresh
  cancel-in-progress: false
jobs:
  news:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_NEWS_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Runner can trigger only the bounded news import, not access the database.
      - name: Refresh published sources
        env:
          NEWS_SYNC_TOKEN: ${{ secrets.NEWS_SYNC_TOKEN }}
        run: |
          test -n "$NEWS_SYNC_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 70 \
            --request POST \
            --header "Authorization: Bearer $NEWS_SYNC_TOKEN" \
            https://hello-world-gold-eight.vercel.app/api/news/scheduled
